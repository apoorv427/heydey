name: tests
on:
  push: {branches: [main]}
  pull_request: {}
jobs:
  pytest:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          python -m venv api/.venv
          api/.venv/bin/pip install -e "api[dev]"
      - name: Test (banned-deps grep included)
        run: api/.venv/bin/python -m pytest api/tests -o addopts="" -q
