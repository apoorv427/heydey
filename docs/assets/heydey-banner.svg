<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Heydey — a local-first, proof-grade AI operating system. It does the work and shows its receipts.">
  <title>Heydey — does the work, shows its receipts</title>
  <defs>
    <radialGradient id="glow" cx="72%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#4FD8C4" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#4FD8C4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4FD8C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FD8C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4FD8C4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- field: deep navy, never pure black (NOCTURNE `field`) -->
  <rect width="1280" height="400" rx="18" fill="#0A0F1E"/>
  <rect width="1280" height="400" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#1C2436"/>

  <!-- left: wordmark + promise -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif">
    <text x="72" y="168" fill="#E6EAF2" font-size="82" font-weight="600" letter-spacing="-1.8">Heydey</text>
    <rect x="74" y="192" width="132" height="2" fill="url(#rule)"/>
    <text x="72" y="242" fill="#E6EAF2" font-size="27" font-weight="500" letter-spacing="-0.3">does the work, shows its receipts</text>
    <text x="72" y="286" fill="#a8b2c8" font-size="17.5" letter-spacing="-0.1">A local-first, proof-grade AI operating system.</text>
    <text x="72" y="313" fill="#a8b2c8" font-size="17.5" letter-spacing="-0.1">Every answer cited to its source — and checked, fail-closed,</text>
    <text x="72" y="340" fill="#a8b2c8" font-size="17.5" letter-spacing="-0.1">by a model from a different maker than the one that wrote it.</text>
  </g>

  <!-- right: the receipt plate (squircle, radius 16 — LOCKED shape) -->
  <g transform="translate(716, 74)">
    <rect width="492" height="252" rx="16" fill="#0D1426" stroke="#1C2436"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, 'SF Mono', monospace" font-size="13">
      <text x="24" y="40" fill="#a8b2c8">Q: What is the cross-model validator rule?</text>

      <text x="24" y="82" fill="#4FD8C4" opacity="0.92">[KB: HEYDEY-EXECUTOR-CONTRACTS.md</text>
      <text x="40" y="102" fill="#a8b2c8">· chunk 3 · score 0.833]</text>
      <text x="24" y="128" fill="#6FCFA9" opacity="0.9">[KB: HEYDEY-EXECUTOR-CONTRACTS.md</text>
      <text x="40" y="148" fill="#a8b2c8">· chunk 2 · score 0.816]</text>
      <text x="24" y="174" fill="#9CC487" opacity="0.85">[KB: HEYDEY-BUILD-DOC-FINAL.md</text>
      <text x="40" y="194" fill="#a8b2c8">· chunk 28 · score 0.754]</text>

      <!-- the validator seal: executor -> validator, a different family -->
      <rect x="23.5" y="210.5" width="444" height="30" rx="15" fill="#0A0F1E" stroke="#4FD8C4" stroke-opacity="0.55"/>
      <text x="40" y="230" fill="#4FD8C4" font-size="12.5">deepseek/deepseek-chat → qwen3:8b · PASS · $0.0004</text>
    </g>
  </g>
</svg>
